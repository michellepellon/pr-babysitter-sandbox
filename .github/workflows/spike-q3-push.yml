# ABOUTME: Task 0 spike Q3 (throwaway): push a trivial commit with GITHUB_TOKEN to a human-opened PR's branch.
# ABOUTME: Lets us see whether CI runs, waits for approval, or never starts for the new head SHA.
name: spike-q3-push

on:
  workflow_dispatch:
    inputs:
      branch:
        description: Head branch of the sandbox test PR
        required: true
        type: string

permissions: {}

jobs:
  push-commit:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.branch }}
      - name: Commit and push a trivial change with GITHUB_TOKEN
        env:
          BRANCH: ${{ inputs.branch }}
          RUN_ID: ${{ github.run_id }}
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          echo "spike-q3: run ${RUN_ID} at $(date -u +%Y-%m-%dT%H:%M:%SZ)" >> spike-q3.txt
          git add spike-q3.txt
          git commit -m "chore(spike): trivial commit from spike-q3 run ${RUN_ID}"
          git push origin "HEAD:refs/heads/${BRANCH}"
          echo "Q3_NEW_HEAD_SHA=$(git rev-parse HEAD)"
