# ABOUTME: Sandbox caller for pr-babysitter's Task 9 runs, from examples/caller.yml.
# ABOUTME: Uses the real federation rule, so rounds spend model budget (Michelle OKed Task 9 scenarios 1-3).

name: babysit

on:
  schedule:
    - cron: "17 * * * *"
  # zizmor: ignore[dangerous-triggers] babysit.yml reads nothing from the triggering run: no artifacts, no payload.
  workflow_run:
    workflows: [ci] # this repo's CI workflow names
    types: [completed]
  workflow_dispatch:

permissions: {}
cache-mode: none

concurrency:
  group: babysit
  cancel-in-progress: false

jobs:
  babysit:
    # Pin to a full commit SHA of pr-babysitter's main branch; replace the zeros.
    uses: michellepellon/pr-babysitter/.github/workflows/babysit.yml@959db533387e423060d4fbedc66b82c2e09bf07a # wip/task9-e2e
    permissions:
      actions: read
      checks: read
      contents: write
      id-token: write
      pull-requests: write
      statuses: read
    with:
      dry_run: false
      setup_command: ""
      test_command: go test ./... -run
      lint_command: ""
      reviewer_bots: ""
      protected_paths: ${{ vars.E2E_PROTECTED_PATHS }} # a variable, so agent cannot read it from the repo (e2e scenario 3)
      federation_rule_id: fdrl_019P91NZJBBY6GcG2xWPmjPh
      organization_id: 7292cca8-ad45-416c-909d-d6573972ad06
      service_account_id: svac_01BJ2pyDHLw1ZepqVY1jfNUj
      workspace_id: wrkspc_01LS215rVaA2338TJq5rpGeY
