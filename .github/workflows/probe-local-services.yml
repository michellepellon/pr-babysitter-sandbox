# ABOUTME: Task 9 probe (throwaway): does a step timeout stop a command run through pr-babysitter-sandbox run?
# ABOUTME: Runs only on pushes to probe/ branches. No environment, no OIDC, no model calls.
name: probe-local-services

on:
  push:
    branches: ["probe/**"]

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: michellepellon/pr-babysitter
          ref: 684e236d7a834d3726a9b7c40146ed376e5f5f17
          path: babysitter
          persist-credentials: false
      - uses: ./babysitter
      - run: mkdir -p "$RUNNER_TEMP/items" && sudo env PATH="$PATH" pr-babysitter-sandbox setup "$GITHUB_WORKSPACE/babysitter" "$RUNNER_TEMP/items"
      - run: sudo pr-babysitter-sandbox close 10.199.0.1:8199
      - name: Run a long command as agent past its step timeout
        timeout-minutes: 1
        continue-on-error: true
        run: |
          cd /home/agent/repo
          sudo env PATH="$PATH" pr-babysitter-sandbox run sh -c 'sleep 600 & exec sleep 600'
      - name: List agent's processes left after the timeout
        if: always()
        run: |
          sleep 5
          if pgrep -u agent -a; then echo "RESULT: agent processes survived the step timeout"; else echo "RESULT: none of agent's processes survived"; fi
