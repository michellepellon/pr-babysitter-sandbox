# ABOUTME: Task 0 spike Q1 (throwaway): can the workflow GITHUB_TOKEN read the rules that apply to main?
# ABOUTME: Calls GET /repos/{repo}/rules/branches/main from a job with no permissions and from one with contents: read.
name: spike-q1-rules

on:
  workflow_dispatch:

permissions: {}

jobs:
  rules-no-permissions:
    runs-on: ubuntu-latest
    permissions: {}
    steps:
      - name: GET rules/branches/main
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          code=$(curl -sS -o body.json -D headers.txt -w '%{http_code}' \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${REPO}/rules/branches/main")
          echo "Q1_HTTP_STATUS=${code}"
          grep -i '^x-accepted-github-permissions:' headers.txt | sed 's/^/Q1_HEADER=/' || true
          echo "Q1_BODY=$(jq -c . body.json)"

  rules-contents-read:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: GET rules/branches/main
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          code=$(curl -sS -o body.json -D headers.txt -w '%{http_code}' \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${REPO}/rules/branches/main")
          echo "Q1_HTTP_STATUS=${code}"
          grep -i '^x-accepted-github-permissions:' headers.txt | sed 's/^/Q1_HEADER=/' || true
          echo "Q1_BODY=$(jq -c . body.json)"
